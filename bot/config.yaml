# Runtime config for the daily signal job.
# Webhooks come from env vars, never from this file:
#   DISCORD_WEBHOOK_ACCIONES / _CRIPTO / _REGIMEN / _REPORTE

equities:
  # 23 names. IRSA is intentionally absent: the IRS ADR trades ~$694k/day,
  # far below the $5M liquidity floor used in the backtest.
  watchlist:
    - {alias: MELI,  symbol: MELI}
    - {alias: MSFT,  symbol: MSFT}
    - {alias: VIST,  symbol: VIST}
    - {alias: NVDA,  symbol: NVDA}
    - {alias: JNJ,   symbol: JNJ}
    - {alias: META,  symbol: META}
    - {alias: YPFD,  symbol: YPF}
    - {alias: PAMP,  symbol: PAM}
    - {alias: NOW,   symbol: NOW}
    - {alias: KO,    symbol: KO}
    - {alias: EWZ,   symbol: EWZ}
    - {alias: IBM,   symbol: IBM}
    - {alias: GOOGL, symbol: GOOGL}
    - {alias: AAPL,  symbol: AAPL}
    - {alias: MU,    symbol: MU}
    - {alias: NU,    symbol: NU}
    - {alias: TSLA,  symbol: TSLA}
    - {alias: AMZN,  symbol: AMZN}
    - {alias: QQQ,   symbol: QQQ}
    - {alias: PLTR,  symbol: PLTR}
    - {alias: BRKB,  symbol: BRK-B}
    - {alias: TSM,   symbol: TSM}
    - {alias: QTUM,  symbol: QTUM}
  benchmark: SPY
  min_conditions: 5          # validated tier: P(up in 10d) = 63.9% vs 55.7% base
  cooldown_bars: 10
  # Exit: first close back above the 20-day mean. Chosen on 71 assets outside
  # the watchlist and validated on it. Beats a fixed 21-session hold in 13 of
  # 16 years, with 78% winners vs 62% and a 5th percentile of -7.2% vs -11.5%.
  # hold_bars is only the backstop for trades that never revert.
  hold_bars: 63

crypto:
  watchlist:
    - {alias: BTC, symbol: BTC-USD}
    - {alias: ETH, symbol: ETH-USD}
    - {alias: BNB, symbol: BNB-USD}
    - {alias: SOL, symbol: SOL-USD}
    - {alias: XRP, symbol: XRP-USD}
    - {alias: ADA, symbol: ADA-USD}
  rank_window: 252
  rebalance_band: 0.10       # only alert when target weight moves more than this
  weight_min: 0.0
  weight_max: 2.0

regime:
  proxy: SPY

# P(price up in 10 sessions) measured on the watchlist, 2010-2026.
# Used only to annotate the alert, never to decide.
calibration:
  base_rate_10d: 0.557
  by_conditions:
    5: {p_up: 0.639, ci: [0.585, 0.694], oos: 0.607, n: 294}
    6: {p_up: 0.679, ci: [0.590, 0.768], oos: 0.622, n: 106}

history_days: 900            # enough for EMA200 + 252d percentile ranks

# Public URL of docs/index.html. Every alert links to it so anyone in the
# server can read why the signal exists without asking. Leave empty to omit.
docs_url: "https://manuerc.github.io/investing/"
