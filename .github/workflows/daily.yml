name: Señales diarias

# 22:30 UTC = después del cierre de Nueva York en cualquier época del año
# (16:00 ET son 20:00 UTC con horario de verano, 21:00 UTC con horario estándar).
# A esa hora la vela diaria de acciones ya cerró; la de cripto todavía no, y el
# motor la descarta solo — ver drop_open_bar() en bot/engine.py.
on:
  schedule:
    - cron: "30 22 * * *"
  workflow_dispatch:          # botón para correrlo a mano desde la pestaña Actions
    inputs:
      dry_run:
        description: "Correr en seco (no manda nada a Discord)"
        type: boolean
        default: false

permissions:
  contents: write             # necesario para commitear el snapshot de estado

concurrency:
  group: senales-diarias      # nunca dos corridas a la vez
  cancel-in-progress: false

jobs:
  señales:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Correr el job
        env:
          DISCORD_WEBHOOK_ACCIONES: ${{ secrets.DISCORD_WEBHOOK_ACCIONES }}
          DISCORD_WEBHOOK_CRIPTO:   ${{ secrets.DISCORD_WEBHOOK_CRIPTO }}
          DISCORD_WEBHOOK_REGIMEN:  ${{ secrets.DISCORD_WEBHOOK_REGIMEN }}
          DISCORD_WEBHOOK_REPORTE:  ${{ secrets.DISCORD_WEBHOOK_REPORTE }}
          DISCORD_WEBHOOK_SCORECARD: ${{ secrets.DISCORD_WEBHOOK_SCORECARD }}
          DISCORD_WEBHOOK_DRIFT:    ${{ secrets.DISCORD_WEBHOOK_DRIFT }}
        run: |
          FLAGS=""
          # domingo -> además del scan, manda el reporte semanal
          [ "$(date -u +%u)" = "7" ] && FLAGS="--report"
          [ "${{ inputs.dry_run }}" = "true" ] && FLAGS="$FLAGS --dry-run"
          echo "flags: $FLAGS"
          python -m bot.run_daily $FLAGS

      - name: Guardar el estado
        run: |
          if [ -n "$(git status --porcelain state/ docs/data/)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/ docs/data/
            git commit -m "estado: corrida del $(date -u +%Y-%m-%d)"
            git push
          else
            echo "sin cambios de estado"
          fi
