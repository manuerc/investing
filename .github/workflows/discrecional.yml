name: Señales discrecionales (experimental)

# Corre cada hora, alineado con velas H1. Independiente del job de
# "Señales diarias" (daily.yml): config, canal de Discord y estado propios.
on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Correr en seco (no manda nada a Discord)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: senales-discrecionales
  cancel-in-progress: false

jobs:
  discrecional:
    name: Discrecional
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Correr el job
        env:
          DISCORD_WEBHOOK_DISCRECIONAL: ${{ secrets.DISCORD_WEBHOOK_DISCRECIONAL }}
        run: |
          FLAGS=""
          [ "${{ inputs.dry_run }}" = "true" ] && FLAGS="--dry-run"
          python -m bot.run_discretionary $FLAGS

      - name: Guardar el estado
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/discrecional_state.json
          if git diff --cached --quiet; then
            echo "sin cambios de estado"
          else
            git commit -m "estado discrecional: corrida del $(date -u +%Y-%m-%dT%H:%M)"
            git push
          fi
